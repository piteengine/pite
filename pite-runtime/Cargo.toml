[package]
name = "pite-runtime"
description = "Game runtime engine: windowing, main loop, fixed physics tick, and hot reload."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pite-runtime"
keywords = ["game-engine", "runtime", "windowing", "hot-reload"]

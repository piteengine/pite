[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pite-stubs"
version = "0.4.0"
description = "Type stubs for the Pite engine's embedded Python API (PEP 561)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Pite Contributors" }]
keywords = ["gamedev", "game-engine", "stubs", "typing", "pyright", "pylance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Typing :: Stubs Only",
]

[project.urls]
Homepage = "https://github.com/piteengine/pite"
Documentation = "https://piteengine.github.io/pite/"
Repository = "https://github.com/piteengine/pite"
Issues = "https://github.com/piteengine/pite/issues"

[tool.hatch.build.targets.wheel]
packages = ["pite"]

[tool.hatch.build.targets.sdist]
include = ["pite", "README.md", "LICENSE-*"]

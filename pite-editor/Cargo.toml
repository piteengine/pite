[package]
name = "pite-editor"
description = "Visual game editor for Pite (egui/eframe): viewport, tree, inspector, and LSP code pane."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pite-editor"
keywords = ["game-engine", "editor", "gui", "egui"]
categories = ["game-engines", "gui"]
readme = "README.md"
publish = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
anyhow.workspace = true
eframe = "0.37"
rfd = "0.17"
serde_json.workspace = true
arboard = "3"
pite-assets.workspace = true
pite-core.workspace = true
pite-project.workspace = true
pite-render.workspace = true
pite-runtime.workspace = true
pite-script.workspace = true
pite-scene.workspace = true
toml.workspace = true
egui-pop-phosphor = "0.15.0"

[build-dependencies]
pite-core.workspace = true

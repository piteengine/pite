[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["examples"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piteengine/pite"
homepage = "https://github.com/piteengine/pite"
publish = false

[workspace.dependencies]
# internal
pite-assets = { path = "crates/pite-assets", version = "0.4.0" }
pite = { path = "crates/pite-cli", version = "0.4.0" }
pite-core = { path = "crates/pite-core", version = "0.4.0" }
pite-editor = { path = "crates/pite-editor", version = "0.4.0" }
pite-project = { path = "crates/pite-project", version = "0.4.0" }
pite-render = { path = "crates/pite-render", version = "0.4.0" }
pite-runtime = { path = "crates/pite-runtime", version = "0.4.0" }
pite-scene = { path = "crates/pite-scene", version = "0.4.0" }
pite-script = { path = "crates/pite-script", version = "0.4.0" }
pite-audio = { path = "crates/pite-audio", version = "0.4.0" }
pite-export = { path = "crates/pite-export", version = "0.4.0" }
pite-physics = { path = "crates/pite-physics", version = "0.4.0" }
pite-player = { path = "crates/pite-player", version = "0.4.0" }

# external
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
crc32fast = "1"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1.0"
rapier2d = "0.36"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis", "mp3", "flac", "wav", "pcm"] }
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
wgpu = "30"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

# Leaner dev artifacts: line tables keep usable backtraces at a fraction
# of full debuginfo size. One-time rebuild, then incremental stays intact.
[profile.dev]
debug = "line-tables-only"
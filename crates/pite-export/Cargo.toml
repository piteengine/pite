[package]
name = "pite-export"
description = "Cross-platform export packager and standalone player bundler for Pite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pite-export"
keywords = ["game-engine", "export", "bundler", "packaging"]
categories = ["game-engines", "development-tools::cargo-plugins"]
readme = "README.md"
publish = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
anyhow.workspace = true
crc32fast.workspace = true
sha2.workspace = true
toml.workspace = true
tracing.workspace = true
zip.workspace = true
pite-project.workspace = true
pite-render.workspace = true
pite-scene.workspace = true

[dev-dependencies]
pite-runtime.workspace = true

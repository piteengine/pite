[package]
name = "pite-project"
description = "Project manifest (pite.toml), res:// paths and templates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pite-project"
keywords = ["game-engine", "manifest", "gamedev"]
categories = ["game-engines", "config"]
readme = "README.md"
publish = true
include = [
    "src/**/*",
    "templates/*.zip",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
    "build.rs",
]

[dependencies]
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
pite-core.workspace = true
pite-scene.workspace = true
zip.workspace = true

[build-dependencies]
zip = { workspace = true }

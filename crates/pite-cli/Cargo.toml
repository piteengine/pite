[package]
name = "pite"
description = "The Pite 2D scene-tree game engine CLI and visual editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pite"
keywords = ["game-engine", "gamedev", "python", "2d", "editor"]
categories = ["game-engines", "command-line-utilities"]
readme = "README.md"
publish = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "pite"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zip.workspace = true
pite-runtime.workspace = true
pite-editor.workspace = true
pite-audio.workspace = true
pite-export.workspace = true
pite-core.workspace = true
pite-scene.workspace = true
pite-project.workspace = true
pite-script.workspace = true
pite-assets.workspace = true

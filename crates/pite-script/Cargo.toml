[package]
name = "pite-script"
description = "Embedded Python 3.12 scripting bridge (PyO3) and game API for Pite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pite-script"
keywords = ["game-engine", "scripting", "python", "pyo3"]
categories = ["game-engines", "api-bindings"]
readme = "README.md"
publish = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
anyhow.workspace = true
pite-assets.workspace = true
pite-audio.workspace = true
pite-core.workspace = true
pite-physics.workspace = true
pite-scene.workspace = true
pyo3 = { version = "0.30", features = ["auto-initialize", "multiple-pymethods"] }
tracing = "0.1"
paste = "1"

name: Release engine and players

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build engine (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            suffix: ""
          - os: windows-latest
            platform: windows
            suffix: ".exe"
          - os: macos-latest
            platform: macos
            suffix: ""
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        # ALSA installs on Linux only (guard lives in the composite);
        # the release profile keeps its own cache key — dev-cache
        # artifacts would only bloat it.
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: release
      - name: Build the engine and player (locked deps)
        shell: bash
        run: cargo build --release --locked -p pite-cli -p pite-player
      - name: Stage the release files under platform names
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/pite${{ matrix.suffix }}" "dist/pite-${{ matrix.platform }}${{ matrix.suffix }}"
          cp "target/release/pite-player${{ matrix.suffix }}" "dist/pite-player-${{ matrix.platform }}${{ matrix.suffix }}"
      - name: Upload the release files
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the release files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out the repo (gh needs the git context)
        uses: actions/checkout@v7
      - name: Download the release files
        uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Assemble the engine bundles (engine + player binaries for all platforms)
        shell: bash
        run: |
          mkdir -p bundle/linux bundle/windows bundle/macos
          cp dist/dist-linux/pite-linux bundle/linux/pite
          cp dist/dist-linux/pite-player-linux bundle/linux/pite-player
          cp dist/dist-windows/pite-player-windows.exe bundle/linux/pite-player.exe
          cp dist/dist-macos/pite-player-macos bundle/linux/pite-player-macos

          cp dist/dist-windows/pite-windows.exe bundle/windows/pite.exe
          cp dist/dist-windows/pite-player-windows.exe bundle/windows/pite-player.exe
          cp dist/dist-linux/pite-player-linux bundle/windows/pite-player
          cp dist/dist-macos/pite-player-macos bundle/windows/pite-player-macos

          cp dist/dist-macos/pite-macos bundle/macos/pite
          cp dist/dist-macos/pite-player-macos bundle/macos/pite-player
          cp dist/dist-windows/pite-player-windows.exe bundle/macos/pite-player.exe
          cp dist/dist-linux/pite-player-linux bundle/macos/pite-player-linux

          tar -czf "dist/pite-${{ github.ref_name }}-linux.tar.gz" -C bundle/linux pite pite-player pite-player.exe pite-player-macos
          zip -j "dist/pite-${{ github.ref_name }}-windows.zip" bundle/windows/pite.exe bundle/windows/pite-player.exe bundle/windows/pite-player bundle/windows/pite-player-macos
          tar -czf "dist/pite-${{ github.ref_name }}-macos.tar.gz" -C bundle/macos pite pite-player pite-player.exe pite-player-linux
      - name: Publish the bundles and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum pite-*.tar.gz pite-*.zip > SHA256SUMS)
          cat dist/SHA256SUMS
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" dist/pite-*.tar.gz dist/pite-*.zip dist/SHA256SUMS --clobber

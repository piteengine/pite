name: Release Builds

# Builds release assets (engine (CLI) and player binaries).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            suffix: ""
          - os: windows-latest
            platform: windows
            suffix: ".exe"
          - os: macos-latest
            platform: macos
            suffix: ""
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: release
      - name: Build the engine and player (locked)
        shell: bash
        run: cargo build --release --locked -p pite -p pite-player
      - name: Stage the release files under platform names
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/pite${{ matrix.suffix }}" "dist/pite-${{ matrix.platform }}${{ matrix.suffix }}"
          cp "target/release/pite-player${{ matrix.suffix }}" "dist/pite-player-${{ matrix.platform }}${{ matrix.suffix }}"
      - name: Upload the release files
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Assemble the engine and player bundles
        shell: bash
        run: bash scripts/assemble-release.sh "${{ github.ref_name }}" dist bundle
      - name: Publish the bundles and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum pite-*.tar.gz pite-*.zip > SHA256SUMS)
          cat dist/SHA256SUMS
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" dist/pite-*.tar.gz dist/pite-*.zip dist/SHA256SUMS --clobber

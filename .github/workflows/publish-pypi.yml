name: Publish PyPI Stubs

# Publishes the `pite-stubs` wheel so external editors (Pylance/Pyright)
# resolve `import pite`. The stub file is generated by
# `crates/pite-editor/build.rs` into `python/pite/__init__.pyi` — it is never
# committed, so the wheel cannot drift from the editor's embedded stubs.
#
# Trusted publishing (no API token): configure PyPI with
#   owner/repo, workflow `publish-pypi.yml`, environment `pypi`.
# TestPyPI needs its own trusted-publisher entry for the same workflow.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      repository:
        description: Target index
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: pypi-stubs

      - name: Version check
        # Always compare the wheel version to the workspace; a tag must also
        # match. Manual dispatches choose their own index (for 0.4.0, whose
        # tag predates this workflow).
        shell: bash
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          py_ver=$(grep -m1 '^version' python/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "cargo: $cargo_ver / pypi: $py_ver"
          test "$cargo_ver" = "$py_ver" || { echo "FATAL: python/pyproject.toml != workspace version"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag: $tag"
            test "$tag" = "$cargo_ver" || { echo "FATAL: tag v$tag != workspace $cargo_ver"; exit 1; }
          fi

      - name: Generate the stub file from the node schema
        run: PITE_STUB_OUT="$PWD/python/pite/__init__.pyi" cargo build --locked -p pite-editor

      - name: Check the generated stub is non-empty
        run: test -s python/pite/__init__.pyi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist python

      - name: Verify wheel contents
        shell: bash
        run: |
          python -m zipfile -l dist/*.whl
          python -m zipfile -l dist/*.whl | grep -q 'pite/__init__\.pyi'
          python -m zipfile -l dist/*.whl | grep -q 'pite/__init__\.py'

      - name: Verify Pylance/Pyright resolves the wheel
        shell: bash
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl "pyright==1.1.411"
          mkdir -p /tmp/smoke && cd /tmp/smoke
          cat > check.py <<'PY'
          import pite


          class Player(pite.Node2D):
              hud = pite.child("HUD")
              hit = pite.signal(int)

              def _ready(self) -> None:
                  self.hit.connect(self._on_hit)
                  print(self.hud.node_path)

              def _process(self, delta: float) -> None:
                  self.position += pite.Vec2(1.0, 0.0)
                  self.hit.emit(1)

              def _on_hit(self, amount: int) -> None:
                  pite.play("res://sfx/hit.wav")


          print(pite.Vec2(1.0, 2.0).to_tuple())
          PY
          /tmp/venv/bin/pyright --pythonpath /tmp/venv/bin/python check.py

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish (TestPyPI)
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish (PyPI)
    if: github.event_name == 'push' || inputs.repository == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

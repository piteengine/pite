name: CI

# Pite Continues Integration:
# - Formatting
# - Build
# - Tests
# - Smoke Tests (LSP, Export)
# - `pite check` on examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the Rust toolchain with rustfmt
        uses: ./.github/actions/rust-python-env
        with:
          components: rustfmt
          python: "false"
          alsa: "false"
      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Build the workspace (locked)
        run: cargo build --workspace --locked

      - name: Check the PyPI stub version matches the workspace
        shell: bash
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          py_ver=$(grep -m1 '^version' python/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "workspace: $cargo_ver / pypi: $py_ver"
          test "$cargo_ver" = "$py_ver" || {
            echo "FATAL: python/pyproject.toml version must match Cargo.toml"
            exit 1
          }

      - name: Generate the PyPI stub file from the node schema
        run: PITE_STUB_OUT="$PWD/python/pite/__init__.pyi" cargo build --locked -p pite-editor

      - name: Build the stub wheel and verify Pyright resolves it
        shell: bash
        run: |
          python -m pip install --upgrade build
          python -m build --outdir /tmp/pypi-dist python
          python -m venv /tmp/pypi-venv
          /tmp/pypi-venv/bin/pip install --quiet /tmp/pypi-dist/*.whl "pyright==1.1.411"
          mkdir -p /tmp/pypi-smoke && cd /tmp/pypi-smoke
          printf 'import pite\n\nclass P(pite.Node2D):\n    def _process(self, delta: float) -> None:\n        self.position += pite.Vec2(1.0, 0.0)\n' > check.py
          /tmp/pypi-venv/bin/pyright --pythonpath /tmp/pypi-venv/bin/python check.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Run the workspace tests (locked)
        run: cargo test --workspace --locked

  lsp-smoke:
    name: LSP Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Cache pip
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-pyright-1.1.411
      - name: Install pinned pyright
        run: pip install "pyright==1.1.411"
      - name: Live LSP smoke test
        run: PITE_LSP_SMOKE=1 cargo test -p pite-editor --lib live_pyright_smoke

  export-smoke:
    name: Export Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Cache the CPython toolchain archive
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pite/toolchains
          key: pite-toolchains-linux-${{ hashFiles('crates/pite-export/src/python_bundle.rs') }}
      - name: Export smoke test
        run: PITE_BUNDLE_SMOKE=1 cargo test -p pite-export --lib

  check:
    name: Projects check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Run pite check on examples
        run: bash scripts/check-examples.sh

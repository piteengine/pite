name: CI

# Pite Continues Integration:
# - Formatting
# - Build
# - Tests
# - Smoke Tests (LSP, Export)
# - `pite check` on examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the Rust toolchain with rustfmt
        uses: ./.github/actions/rust-python-env
        with:
          components: rustfmt
          python: "false"
          alsa: "false"
      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Build the workspace (locked)
        run: cargo build --workspace --locked

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Run the workspace tests (locked)
        run: cargo test --workspace --locked

  lsp-smoke:
    name: LSP Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Cache pip
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-pyright-1.1.411
      - name: Install pinned pyright
        run: pip install "pyright==1.1.411"
      - name: Live LSP smoke test
        run: PITE_LSP_SMOKE=1 cargo test -p pite-editor --lib live_pyright_smoke

  export-smoke:
    name: Export Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Cache the CPython toolchain archive
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pite/toolchains
          key: pite-toolchains-linux-${{ hashFiles('pite-export/src/python_bundle.rs') }}
      - name: Export smoke test
        run: PITE_BUNDLE_SMOKE=1 cargo test -p pite-export --lib

  check:
    name: Projects check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Run pite check on examples
        run: bash scripts/check-examples.sh

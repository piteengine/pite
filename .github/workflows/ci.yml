name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Install the Rust toolchain with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build the workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up system Python 3.12 (link target for embedded builds)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Share the cargo cache across jobs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: Install ALSA headers (cpal device output)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Export the Python env for embedded builds
        run: |
          echo "PYO3_PYTHON=$(which python3.12)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(python3.12 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")" >> "$GITHUB_ENV"
      - name: Build the workspace (locked deps)
        run: cargo build --workspace --locked

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up system Python 3.12 (link target for embedded builds)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Share the cargo cache across jobs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: Install ALSA headers (cpal device output)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Export the Python env for embedded builds
        run: |
          echo "PYO3_PYTHON=$(which python3.12)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(python3.12 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")" >> "$GITHUB_ENV"
      - name: Run the workspace tests
        run: cargo test --workspace

  lsp-smoke:
    name: LSP smoke (real pyright over stdio)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up system Python 3.12 (link target for embedded builds)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Share the cargo cache across jobs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: Install ALSA headers (cpal device output)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Export the Python env for embedded builds
        run: |
          echo "PYO3_PYTHON=$(which python3.12)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(python3.12 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")" >> "$GITHUB_ENV"
      - name: Install pinned pyright (editor LSP smoke)
        run: pip install "pyright==1.1.411"
      - name: Run the live LSP smoke test
        run: PITE_LSP_SMOKE=1 cargo test -p pite-editor --lib live_pyright_smoke

  bundle-smoke:
    name: Python bundling smoke (pinned CPython download + export layout)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up system Python 3.12 (link target for embedded builds)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Share the cargo cache across jobs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: Install ALSA headers (cpal device output)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Export the Python env for embedded builds
        run: |
          echo "PYO3_PYTHON=$(which python3.12)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(python3.12 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")" >> "$GITHUB_ENV"
      - name: Run the export tests with a real CPython download
        run: PITE_BUNDLE_SMOKE=1 cargo test -p pite-export --lib

  check:
    name: Project check (pite check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up system Python 3.12 (link target for embedded builds)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Share the cargo cache across jobs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: Install ALSA headers (cpal device output)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Export the Python env for embedded builds
        run: |
          echo "PYO3_PYTHON=$(which python3.12)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(python3.12 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")" >> "$GITHUB_ENV"
      - name: Run pite check on the repo
        run: cargo run -p pite-cli -- check

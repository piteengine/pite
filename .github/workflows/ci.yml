name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs share one cargo cache key and run in parallel (no needs: gates):
# each job recompiles only what it needs from cache, so serializing them
# bought latency without saving work.
jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the Rust toolchain with rustfmt
        uses: ./.github/actions/rust-python-env
        with:
          components: rustfmt
          python: "false"
          alsa: "false"
      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build the workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Build the workspace (locked deps)
        run: cargo build --workspace --locked

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Run the workspace tests (locked deps, like the release)
        run: cargo test --workspace --locked

  lsp-smoke:
    name: LSP smoke (real pyright over stdio)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Cache pip downloads (pinned pyright below)
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-pyright-1.1.411
      - name: Install pinned pyright (editor LSP smoke)
        run: pip install "pyright==1.1.411"
      - name: Run the live LSP smoke test
        run: PITE_LSP_SMOKE=1 cargo test -p pite-editor --lib live_pyright_smoke

  bundle-smoke:
    name: Python bundling smoke (pinned CPython download + export layout)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Cache the CPython toolchain archive (60 MB download)
        # The archive lives under ~/.cache/pite/toolchains (see
        # pite-export/src/python_bundle.rs) and is re-verified by checksum
        # on every use, so a cached copy is never trusted blindly.
        # Hashing the pin source busts the cache the moment the pin moves.
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pite/toolchains
          key: pite-toolchains-linux-${{ hashFiles('pite-export/src/python_bundle.rs') }}
      - name: Run the export tests with a real CPython download
        run: PITE_BUNDLE_SMOKE=1 cargo test -p pite-export --lib

  check:
    name: Project check (pite check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up the build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: workspace
      - name: Run pite check on the repo (locked deps, like the release)
        run: cargo run --locked -p pite-cli -- check

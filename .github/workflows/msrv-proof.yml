name: MSRV Proof

# Runs build + test on crates with the claimed `rust-version`
# in the workspace manifest to verify its value is correct.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Read MSRV from workspace manifest
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          test -n "$v" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Claimed MSRV: $v"

      - name: Install toolchain (no cargo cache)
        uses: ./.github/actions/rust-python-env
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cargo check (locked)
        run: cargo check --locked --all-targets

      - name: Test (locked)
        run: cargo test --locked

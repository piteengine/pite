# Publish the three public crates to crates.io — separate from release.yml
# so engine bundles and registry publishes re-run independently.
#
# RELEASE FLOW (crates.io has no pre-registration for non-existent crates):
# 1. FIRST release is manual: `cargo login`, then publish core → project →
#    scene from a clean tree, in order (scene verifies against the live index).
# 2. Afterwards, configure a trusted publisher on each crate (repository
#    piteengine/pite, workflow file publish-crates.yml) + confirm 2FA/owners.
# 3. From the SECOND release on, pushing a `v*` tag publishes automatically,
#    no tokens involved.
# The tag MUST equal the workspace version (v0.2.0 ↔ 0.2.0) — lockstep (§0.4).
# The version check below fails the run loudly otherwise.
name: Publish crates to crates.io

on:
  # Strict x.y.z only — milestone tags like v0.1-m5 must NOT fire this:
  # the tag≡version check would fail them loudly every time.
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # trusted publishing (OIDC) — no registry token in secrets

jobs:
  publish:
    name: Publish pite crates (core → project → scene)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Tag must equal workspace version (lockstep)
        # Tag pushes only — manual dispatches have no tag to compare.
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "tag: $tag / workspace: $ver"
          test "$tag" = "$ver" || { echo "tag v$tag != workspace $ver — bump Cargo.toml first"; exit 1; }

      - name: Auth preflight (OIDC present? token fallback set?)
        shell: bash
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC available — trusted publishing will be attempted"
          else
            echo "NO OIDC VARS — trusted publishing cannot work on this runner"
          fi
          if [ -n "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is set (fallback path)"
          else
            echo "no CARGO_REGISTRY_TOKEN secret (trusted publishing is the only path)"
          fi
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -n "${CARGO_REGISTRY_TOKEN:-}" ] || {
            echo "neither OIDC nor a token is available — check the trusted publisher on crates.io (exact workflow filename publish-crates.yml, no environment) or add a CARGO_REGISTRY_TOKEN secret"
            exit 1
          }

      - name: Publish pite-core
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-core

      - name: Publish pite-project
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-project

      - name: Publish pite-scene (waits for live core)
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-scene --wait-for pite-core

name: Publish Crates

# Publish all crates to registry. Checks version to match everywhere.
#
# Depends on `CARGO_REGISTRY_TOKEN` secret.
#
# Note: Already-waited crates are ignored, so some of internal dependencies
# are not listed here.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/rust-python-env
        with:
          cache-key: publish

      - name: Lockstep check
        # Tag pushes only, manual dispatches have no tag to compare.
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "tag: $tag / workspace: $ver"
          test "$tag" = "$ver" || { echo "FATAL: v$tag (tag ref) != $ver (workspace), bump Cargo.toml"; exit 1; }

      - name: Token check
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ -n "${CARGO_REGISTRY_TOKEN:-}" ] || {
            echo "FATAL: No CARGO_REGISTRY_TOKEN secret"
            exit 1
          }
          echo "registry token present"

      - name: Core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-core

      - name: Audio
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-audio

      - name: Physics (waits for Core)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-physics --wait-for pite-core

      - name: Scene
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-scene

      - name: Render
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-render

      - name: Project (waits for Scene)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-project --wait-for pite-scene

      - name: Assets (waits for Render)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-assets --wait-for pite-render

      - name: Script (waits for Assets, Audio, Physics)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-script --wait-for pite-assets,pite-audio,pite-physics

      - name: Runtime (waits for Script, Project)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-runtime --wait-for pite-script,pite-project

      - name: Export (waits for Runtime)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-export --wait-for pite-runtime

      - name: Editor
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-editor

      - name: Player
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite-player

      - name: Pite (CLI) (waits for Editor, Export)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crate.sh pite --wait-for pite-editor,pite-export

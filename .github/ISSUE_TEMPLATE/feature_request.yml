name: Feature Request
description: Propose a new feature, node type, engine capability, or editor workflow improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement! For open-ended discussions or exploratory architectural questions, feel free to open a [GitHub Discussion](https://github.com/piteengine/pite/discussions).
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is this proposal related to a limitation, pain point, or missing capability in Pite?
      placeholder: I run into difficulty when trying to...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the feature, node type, or CLI addition you would like to see.
      placeholder: Detailed description of the proposed behavior...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches or workarounds have you considered or tested?
    validations:
      required: false
  - type: dropdown
    id: target-subsystem
    attributes:
      label: Target Subsystem
      options:
        - Editor (egui / viewport / inspector / completion)
        - Core (Scene tree, node lifecycle, handles)
        - Scripting (Python bindings, signals, embedded module)
        - Physics (rapier2d, rigidbodies, colliders)
        - Render (Renderer2D, wgpu pipeline, shaders)
        - Assets (Importer, UID registry, formats)
        - Audio (Playback, streaming, sound cues)
        - Export and Toolchain (Python bundling, player packaging)
        - CLI (new, run, check, edit, vendor)
        - Documentation and Examples
    validations:
      required: true
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Alignment Checklist
      options:
        - label: This aligns with Pite's scene-tree architecture and Python-first design philosophy.
          required: true

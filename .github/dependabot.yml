version: 2
updates:
  # Groups minor and patch bumps but creates multiple PRs for majors
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    commit-message:
      prefix: "dep"
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Group all actions (usually stable) to one PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    commit-message:
      prefix: "dep(actions)"
    groups:
      actions:
        patterns: ["*"]
